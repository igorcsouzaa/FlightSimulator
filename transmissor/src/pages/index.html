<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Transmissor</title>
    <link rel="stylesheet" href="../static/style.css" />
    <script src="../static/renderer.js"></script>
  </head>
  <body>
    <header class="main-header">
      <div class="logo">
        <div class="imgLogo"></div>
        <div class="logoName">
          <div class="big-text">MFSIM</div>
          <div class="small-text blue-text">SIMULADORES DE VÔO</div>
        </div>
      </div>
      <div class="transmitting">
        <div class="dot"></div>
        <div class="text">TRANSMITINDO</div>
      </div>
    </header>
    <div class="container">
      <div class="container-title">
        <div class="blue-text">- INSERIR DADOS DA AERONAVE -</div>
        <div class="line"></div>
      </div>
      <div class="container-inputs">
        <div class="input-box">
          <div class="information">
            <div class="big-text">VELOCIDADE</div>
            <div class="small-text blue-text">NÓS (KT)</div>
            <div class="small-text blue-text">MIN - MAX: 0 - 200</div>
          </div>
          <div class="input">
            <div class="range-wrapper">
                <input type="range" min="0" max="200" value="0" />
                <div class="range-ticks">
                    <span>0</span>
                    <span>50</span>
                    <span>100</span>
                    <span>150</span>
                    <span>200</span>
                </div>
            </div>
        </div>
          <div class="value">
            <div class="number big-text blue-text">000</div>
            <div class="small-text blue-text">KTS</div>
          </div>
        </div>
        <div class="input-box">
          <div class="information">
            <div class="big-text">VELOCIDADE VERT</div>
            <div class="small-text blue-text">PÉS/MIN (VSI)</div>
            <div class="small-text blue-text">MIN - MAX: -2000 - +2000</div>
          </div>
          <div class="input">
            <div class="range-wrapper">
                <input type="range" class="orange-range" min="-2000" max="2000" value="0" />
                <div class="range-ticks">
                    <span>-2000</span>
                    <span>-1000</span>
                    <span>0</span>
                    <span>+1000</span>
                    <span>+2000</span>
                </div>
            </div>
        </div>
          <div class="value">
            <div class="number big-text orange-text">+000</div>
            <div class="small-text orange-text">PÉS/MIN</div>
          </div>
        </div>
      </div>
    </div>
    <div class="footer">
      <div class="footer-output-text">
        ARQUIVO DE SAÍDA: flightSimulator\shared\flightData.js
      </div>
    </div>
  </body>
</html>
