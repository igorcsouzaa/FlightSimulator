<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Leitor</title>
    <link rel="stylesheet" href="../static/style.css" />
  </head>
  <body>
    <header class="main-header">
      <div class="logo">
        <div class="imgLogo"></div>
        <div class="logoName">
          <div class="big-text">MFSIM</div>
          <div class="small-text blue-text">SIMULADORES DE VÔO</div>
        </div>
      </div>
      <div class="right-header-text">
        <div class="dot"></div>
        <div class="text">RECEBENDO</div>
      </div>
    </header>
    <div class="content">
      <div class="container-indicators">
        <div class="as-view">
          <div class="indicator-wrapper">
              <div class="as-indicator"></div>
              <div class="needle as-needle" id="needleAS"></div>
          </div>
          <div class="as-text">
              <div class="big-text">VELOCIDADE</div>
              <div class="small-text blue-text">NÓS (KT)</div>
          </div>
        </div>
        
        <div class="vs-view">
            <div class="indicator-wrapper">
                <div class="vs-indicator"></div>
                <div class="needle vs-needle" id="needleVS"></div>
            </div>
            <div class="vs-text">
                <div class="big-text">VELOCIDADE VERTICAL</div>
                <div class="small-text blue-text">PÉS/MIN (VSI)</div>
            </div>
        </div>
      </div>
    </div>
    <div class="footer">
      <div class="footer-output-text">
        RECEBENDO DE: flightSimulator\shared\flightData.js
      </div>
    </div>
    <script src="../static/renderer.js"></script>
  </body>
</html>
